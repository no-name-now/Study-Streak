<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Study Streak · PAU 400L SEN Exam Prep</title>
<meta name="theme-color" content="#2f5d50">
<script>try{var _t=localStorage.getItem("pau400sen_theme");if(_t==="dark"||_t==="light")document.documentElement.dataset.theme=_t}catch(e){}</script><link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4ef; --card:#fff; --ink:#1b1a17; --muted:#6c6962; --line:#e5e2d9;
  --accent:#2f5d50; --accent-soft:#e3eee9; --warn:#b4541a; --warn-soft:#fbeee3;
  --good:#2e7d4f; --good-soft:#e5f3ea; --bad:#b3261e; --bad-soft:#fbe9e7;
  --fire:#ff7a1a; --xp:#6a4bd6; --gold:#d9a400; --c:var(--accent);
  --on-ink:#fff; --soft:#faf9f6; --soft2:#f1efe9; --input:#fff; --blue-soft:#eef1f8; --blue:#3b5b92;
  --hl:#fff8e6; --warm:#fffdf5; --card2:#fbfaf7; --fire-soft:#fff1e6; --xp-soft:#efeafe; --bar-off:#c9c5ba;
  --red:#d64545; --amber:#e0a100; --green:#2e9d5b;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141512; --card:#1e1f1b; --ink:#ecebe5; --muted:#a3a097; --line:#35362f;
  --accent:#72b8a2; --accent-soft:#1f3830; --warn:#f2a66e; --warn-soft:#3a291c;
  --good:#5cc489; --good-soft:#1b3326; --bad:#ff8a80; --bad-soft:#3c1f1d; --xp:#a08cff;
  --on-ink:#141512; --soft:#191a17; --soft2:#2a2b26; --input:#161714; --blue-soft:#1d2538; --blue:#9db4e8;
  --hl:#352e1c; --warm:#211f19; --card2:#1b1c19; --fire-soft:#3a2617; --xp-soft:#28223f; --bar-off:#45463f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141512; --card:#1e1f1b; --ink:#ecebe5; --muted:#a3a097; --line:#35362f;
  --accent:#72b8a2; --accent-soft:#1f3830; --warn:#f2a66e; --warn-soft:#3a291c;
  --good:#5cc489; --good-soft:#1b3326; --bad:#ff8a80; --bad-soft:#3c1f1d; --xp:#a08cff;
  --on-ink:#141512; --soft:#191a17; --soft2:#2a2b26; --input:#161714; --blue-soft:#1d2538; --blue:#9db4e8;
  --hl:#352e1c; --warm:#211f19; --card2:#1b1c19; --fire-soft:#3a2617; --xp-soft:#28223f; --bar-off:#45463f;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16.5px;line-height:1.55;padding-bottom:96px}
button{font:inherit}
a{color:var(--accent)}
/* top bar */
#top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
#top .w{max-width:920px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px}
.brand{font-weight:900;font-size:15px;letter-spacing:.2px;cursor:pointer}
.stats{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.fire{color:var(--fire)} .chip.xp{color:var(--xp)} .chip.goal{color:var(--good)}
.chip.dim{color:var(--muted);filter:grayscale(1)}
nav{max-width:920px;margin:0 auto;padding:0 10px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
nav button.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
main{max-width:920px;margin:0 auto;padding:16px 14px}
h1{font-size:25px;line-height:1.2;margin:4px 0 6px;letter-spacing:-.2px}
h2{font-size:20px;margin:22px 0 8px}
h3{font-size:17px;margin:14px 0 6px}
p{margin:8px 0}
.sub{color:var(--muted);margin-top:0}
.kbd{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.grid .card{margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;background:var(--ink);color:var(--on-ink);font-weight:700;padding:11px 16px;border-radius:12px;cursor:pointer;margin:4px 6px 4px 0;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .05s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.green{background:var(--good)} .btn.red{background:var(--bad)} .btn.purple{background:var(--xp)} .btn.orange{background:var(--fire)}
.btn.green,.btn.red,.btn.purple,.btn.orange{color:#fff}:root[data-theme="dark"] .btn.green,:root[data-theme="dark"] .btn.red,:root[data-theme="dark"] .btn.purple{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.green,:root:not([data-theme="light"]) .btn.red,:root:not([data-theme="light"]) .btn.purple{color:#111}}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:6px 11px;font-size:14px;border-radius:10px}
.btn.big{padding:14px 22px;font-size:17px}
.btn:disabled{opacity:.4;cursor:default}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);width:0;border-radius:99px;transition:width .4s}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink);margin:2px 4px 2px 0}
.pill.m{background:var(--good-soft);color:var(--good)} .pill.l{background:var(--blue-soft);color:var(--blue)} .pill.r{background:var(--warn-soft);color:var(--warn)} .pill.o{background:var(--soft2);color:var(--muted)}
.hook{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.hook:before{content:"🧠 Memory hook: ";font-weight:700}
.trap{background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.trap:before{content:"⚠️ Exam trap: ";font-weight:700}
.trig{background:var(--blue-soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.trig:before{content:"🎯 If you see: ";font-weight:700}
.def{border-left:4px solid var(--c);padding:6px 12px;margin:10px 0;background:var(--soft);border-radius:0 8px 8px 0}
.def b:first-child{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14.5px;margin:10px 0;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--soft2)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.flow span{background:var(--c);color:#fff;border-radius:8px;padding:5px 10px;font-size:14px;font-weight:600}
.flow em{color:var(--muted);font-style:normal}
.prog{display:flex;gap:4px;margin:10px 0 14px}
.prog i{flex:1;height:7px;border-radius:99px;background:var(--line)}
.prog i.d{background:var(--c)}
textarea,input[type=text],input[type=number]{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--input);color:var(--ink)}
textarea{min-height:100px}
.reveal{display:none}.reveal.show{display:block}
.pts label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.pts input{margin-top:5px;transform:scale(1.2)}
.ok{background:var(--good-soft);color:var(--good);padding:8px 12px;border-radius:8px;font-weight:600}
.no{background:var(--bad-soft);color:var(--bad);padding:8px 12px;border-radius:8px;font-weight:600}
.fc{min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;font-size:18.5px}
.fc .side{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:108px;height:108px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:20px;line-height:1.1}
.ring .lbl small{font-size:11px;font-weight:600;color:var(--muted)}
.block{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.block:last-child{border:none}
.block .dot{width:12px;height:12px;border-radius:99px;flex:0 0 12px;background:var(--c)}
.block .what{flex:1}
.block .min{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
.block.done .what{text-decoration:line-through;color:var(--muted)}
.quest{display:flex;gap:10px;align-items:center;padding:8px 0}
.quest .ic{font-size:24px;width:34px;text-align:center}
.quest .q{flex:1}
.quest.done .q{color:var(--muted)}
.day{border-left:4px solid var(--line);padding:6px 0 6px 12px;margin:6px 0}
.day.today{border-color:var(--fire)}
.day.exam{border-color:var(--bad)}
.badge{text-align:center;padding:12px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.badge .e{font-size:30px}
.badge.lock{opacity:.35;filter:grayscale(1)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.lb{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.lb .rk{width:28px;font-weight:900;color:var(--muted)}
.lb.me{background:var(--hl)}
/* timer */
#timer{position:fixed;left:0;right:0;bottom:0;background:#1b1a17;color:#fff;z-index:30}
#timer .w{max-width:920px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#timer .clock{font-size:23px;font-weight:900;font-variant-numeric:tabular-nums;min-width:72px}
#timer button{background:#ffffff22;color:#fff;border:none;border-radius:8px;padding:7px 10px;font-size:13.5px;cursor:pointer}
#timer button.go{background:var(--good);font-weight:800}
#timer .lbl{font-size:12.5px;opacity:.85;flex:1;min-width:120px}
/* modal + toast */
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal .card{max-width:430px;width:100%;text-align:center;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--on-ink);padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;animation:pop .2s ease;box-shadow:0 4px 14px #0003}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:55}
.bigemoji{font-size:58px;line-height:1}
.xpgain{font-size:34px;font-weight:900;color:var(--xp)}
ul{padding-left:22px;margin:6px 0} li{margin:3px 0}
@media(max-width:560px){#timer .lbl{display:none}#timer .clock{font-size:21px;min-width:64px}#timer .w{flex-wrap:nowrap}body{padding-bottom:70px}}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.onb{max-width:560px;margin:20px auto}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:14px;margin:8px 0;cursor:pointer;background:var(--card)}
.opt.on{border-color:var(--good);background:var(--good-soft)}
.opt input{transform:scale(1.4);margin-top:5px}
.warnbox{background:var(--warn-soft);border:1px solid #f0d3bd;border-radius:12px;padding:10px 12px;font-size:14.5px}
#search{border:1px solid var(--line);border-radius:10px;background:var(--input);color:var(--ink);padding:7px 10px;width:min(220px,38vw);font:inherit}
.searchResult{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px;cursor:pointer}
@media print{:root{--bg:#fff;--card:#fff;--ink:#111;--muted:#555;--line:#bbb;--soft:#f6f6f6;--soft2:#eee}body{background:#fff;padding:0;font-size:11pt}#top,#timer,#toast,#confetti,.no-print,button,textarea{display:none!important}main{max-width:none;padding:0}.card{break-inside:avoid;border:0;border-bottom:1px solid #bbb;border-radius:0;padding:8px 0;margin:0}details>*{display:block!important}details>summary{display:none!important}h1,h2,h3{break-after:avoid}}
td[style*="#f6d4d1"]{color:#111}
a.btn{text-decoration:none}
.brand{white-space:nowrap}
#search{min-width:0;flex:0 1 220px}
@media(max-width:640px){.brand .bt{display:none}#top .w{gap:6px}.chip{padding:4px 8px;font-size:13px}}
@media(max-width:430px){.chip.xp{display:none}}
#themeBtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 9px;cursor:pointer;font-size:15px}
.conf{display:inline-flex;gap:4px;margin-left:auto}
.conf button{width:28px;height:28px;border-radius:99px;border:2px solid var(--line);background:var(--card);cursor:pointer;padding:0;font-size:12px}
.conf button.r.on{background:var(--red);border-color:var(--red)} .conf button.a.on{background:var(--amber);border-color:var(--amber)} .conf button.g.on{background:var(--green);border-color:var(--green)}
.conf button.r{border-color:var(--red)} .conf button.a{border-color:var(--amber)} .conf button.g{border-color:var(--green)}
.frame{border-left:5px solid var(--c);padding-left:12px;margin:14px 0}
.frame h3{margin:0 0 2px}.frame .kbd{margin-bottom:6px}
.frame textarea{min-height:90px}
.sticky{position:sticky;top:calc(var(--toph,100px) + 6px);z-index:15}
.qgrp{display:flex;gap:10px;align-items:flex-start;padding:10px;border:2px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--card)}
.qgrp.on{border-color:var(--good);background:var(--good-soft)}
.eve-trap{background:var(--warn-soft);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:14.5px}
.eve-hook{background:var(--accent-soft);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:14.5px}
</style>

<body>
<div id="top"><div class="w">
  <div class="brand" onclick="go('home')">🔥 <span class="bt">Study Streak</span></div>
  <input id="search" type="text" placeholder="Search · Ctrl+K" aria-label="Search lessons and questions" oninput="searchAll(this.value)" onkeydown="if(event.key==='Escape'){this.value='';searchAll('')}" />
  <button id="themeBtn" onclick="cycleTheme()" title="Theme: auto / light / dark" aria-label="Switch theme">🌓</button>

</div><nav id="nav"></nav></div>

<script>
/* =====================================================================
   STUDY STREAK — engine. All progress lives in this browser (localStorage).
   ===================================================================== */
const KEY='pau400sen_v1';
const APP_VERSION=1;
let ST=load();
function blank(){return{v:APP_VERSION,profile:null,xp:0,days:{},streak:{count:0,last:null,best:0},freezes:0,
  badges:{},topics:{},srs:{},examsDone:{},mocks:{},planCache:{},quests:{},feyn:{},flags:{},weak:{},conf:{},essays:{},sits:{},sitDraft:{},lastSeen:null}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v)return Object.assign(blank(),s)}catch(e){}return blank()}
let saveT=null;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}},150);syncSchedule()}
function saveNow(noSync){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}if(noSync!==true&&!(noSync&&noSync.type))syncSchedule()}

/* ---------- dates ---------- */
function dk(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseDk(k){const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)}
function addDays(k,n){const d=parseDk(k);d.setDate(d.getDate()+n);return dk(d)}
function diffDays(a,b){return Math.round((parseDk(b)-parseDk(a))/864e5)}
const TODAY=()=>dk();
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pretty(k){const d=parseDk(k);return WD[d.getDay()]+' '+d.getDate()+' '+MO[d.getMonth()]}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- catalog ---------- */
const COURSES=CATALOG.courses.map(c=>{
  const data=(window.COURSE_DATA||{})[c.id];
  const topics=data&&data.topics?data.topics.map(t=>Object.assign({outline:false},t)):c.topics.map((t,i)=>({id:'t'+(i+1),n:'Topic '+(i+1),title:t,outline:true}));
  topics.forEach((t,i)=>{if(!t.n)t.n='Topic '+(i+1)});
  return Object.assign({},c,{topics,data:data||null,examDay:c.exam.slice(0,10)});
});
const CBY=Object.fromEntries(COURSES.map(c=>[c.id,c]));
const COURSE_GUIDES={
  cos409:[{name:'Complete study guide',file:'study-guide.docx',type:'docx'}],
  ins401:[{name:'Complete study guide',file:'study-guide.docx',type:'docx'},{name:'Shorter study guide (9 Nov)',file:'short-guide.docx',type:'docx',note:'Earlier, shorter version.'}],
  sen412:[{name:'Exam study guide (17 Nov, newest)',file:'exam-guide.docx',type:'docx',note:'Covers decks up to Data Types.'},{name:'Complete study guide (6 Oct)',file:'study-guide.docx',type:'docx',note:'Earlier guide: decks 0–3 only.'}],
  sen401:[{name:'Complete study guide',file:'study-guide.docx',type:'docx'},{name:'Weeks 2–5 study guide',file:'weeks2to5-guide.docx',type:'docx'}],
  sen419:[{name:'UI/UX and Front-end Development',file:'ui-ux.pdf',type:'pdf'},{name:'Front-end Practical',file:'frontend-practical.pdf',type:'pdf'},{name:'Backend Development',file:'backend-development.pdf',type:'pdf'},{name:'Backend Practical',file:'backend-practical.pdf',type:'pdf'},{name:'Mobile Development',file:'mobile-development.pdf',type:'pdf'},{name:'Deployment',file:'deployment.pdf',type:'pdf'},{name:'Deployment Practical',file:'deployment-practical.pdf',type:'pdf'},{name:'Exam review',file:'exam-review.pdf',type:'pdf'}],
  sen408:[{name:'Complete study guide',file:'study-guide.docx',type:'docx'}],
  csc420:[{name:'Exam study guide (17 Nov, newest)',file:'exam-guide.docx',type:'docx'},{name:'Complete study guide (27 Oct)',file:'study-guide.docx',type:'docx',note:'Earlier guide, before the MongoDB lectures.'},{name:'Practical exam lab guide',file:'lab-guide.docx',type:'docx'}],
  sen418:[{name:'Complete study guide',file:'study-guide.docx',type:'docx'},{name:'Easy study guide (PDF)',file:'quick-guide.pdf',type:'pdf'}]
};
function studyResources(cid){const resources=COURSE_GUIDES[cid]||[],base='assets/course-guides/'+cid+'/';if(!resources.length)return'';

  if(gap>0){if(s.count>0)ST.flags.lostStreak=s.count;s.count=0;s.last=null}

}

/* ---------- ROADMAP (rebalancing plan) ---------- */
function buildPlan(){
  const t=TODAY(),courses=pendingCourses();if(!courses.length)return{days:[],atRisk:[]};
  const lastExam=courses.map(c=>c.examDay).sort().pop();
  const days=[];for(let k=t;k<=lastExam;k=addDays(k,1))days.push({k,cap:goalFor(k),blocks:[],used:0,exam:courses.filter(c=>c.examDay===k)});
  const D=Object.fromEntries(days.map(d=>[d.k,d]));
  const put=(d,b)=>{d.blocks.push(b);d.used+=b.min};
  // 1) spaced review slot every day (15 min) once anything has been studied
  const anyStarted=Object.keys(ST.srs).length>0;
  // 2) mock day before + final review on exam day
  courses.forEach(c=>{const pre=addDays(c.examDay,-1);const d=D[pre]||D[t];if(d)put(d,{c:c.id,type:'mock',min:60,label:'Timed mock + fix weak spots'});
    const e=D[c.examDay];if(e)put(e,{c:c.id,type:'cheat',min:30,label:'Cheat-sheet + flashcards before the exam'})});
  // 3) topic units
  const queue={};courses.forEach(c=>{queue[c.id]=c.topics.filter(tp=>!tp.noExam&&topicState(c.id,tp.id)!=='mastered').map(tp=>{const p=ST.topics[tkey(c.id,tp.id)];const read=tp.outline?false:(p&&tp.cards&&p.cards.length>=tp.cards.length);const lm=tp.outline?45:Math.min(70,Math.max(35,tp.cards.length*6+20));return{c:c.id,t:tp.id,type:read?'practice':'learn',min:read?20:lm,label:(tp.outline?'Study from guide: ':read?'Recall + theory: ':'Learn + recall: ')+tp.title}})});
  const deadline=c=>addDays(c.examDay,-1);
  let last=null;
  days.forEach(d=>{
    if(anyStarted&&d.cap>=90)put(d,{c:null,type:'review',min:15,label:'Spaced review (due cards)'});
    let guard=0;
    while(d.used<d.cap-10&&guard++<20){
      let best=null,bs=-1;
      courses.forEach(c=>{const q=queue[c.id];if(!q.length)return;if(d.k>deadline(c))return;
        const left=Math.max(1,diffDays(d.k,deadline(c))+1);const rem=q.reduce((a,u)=>a+u.min,0);let s=rem/left;if(c.id===last)s*=.75;if(s>bs){bs=s;best=c}});
      if(!best)break;const u=queue[best.id][0];if(d.used+u.min>d.cap+10)break;
      queue[best.id].shift();put(d,u);last=best.id}
  });
  const atRisk=courses.map(c=>({c,min:queue[c.id].reduce((a,u)=>a+u.min,0),n:queue[c.id].length})).filter(x=>x.n>0);
  return{days,atRisk};
}

function searchAll(raw){const box=document.getElementById('searchResults'),q=raw.trim().toLowerCase();if(!box)return;if(q.length<2){box.style.display='none';return}
  const hits=searchIndex().filter(x=>x.text.toLowerCase().includes(q)).slice(0,30);
  box.innerHTML=`<div class="row" style="justify-content:space-between"><b>Search results (${hits.length}${hits.length===30?' shown':''})</b><button class="btn small ghost" onclick="document.getElementById('searchResults').style.display='none'">Close</button></div>${hits.length?hits.map(x=>`<button class="searchResult" onclick="document.getElementById('searchResults').style.display='none';document.getElementById('search').value='';go('${x.target}')"><b>${esc(x.label)}</b><div class="kbd">${esc(x.text.slice(0,180))}</div></button>`).join(''):'<p class="kbd">No matches. Try a shorter term.</p>'}`;box.style.display='block'}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();const s=document.getElementById('search');s.focus();s.select()}if(e.key==='Escape')document.getElementById('searchResults').style.display='none'});
function rememberMiss(cid,tid,q){const id=cid+'-'+tid+'-'+hash(q.q);const old=ST.weak[id]||{cid,tid,q:q.q,count:0};old.count++;ST.weak[id]=old;save()}
function rememberCorrect(cid,tid,q){const id=cid+'-'+tid+'-'+hash(q.q),old=ST.weak[id];if(old){old.count--;if(old.count<=0)delete ST.weak[id];save()}}
function weakDrill(){const list=Object.entries(ST.weak||{}).filter(([,x])=>x.count>0).map(([id,x])=>{const c=CBY[x.cid],t=c&&c.topics.find(z=>z.id===x.tid),q=t&&(t.quiz||[]).find(z=>z.q===x.q);return q?{id,c,t,q,count:x.count}:null}).filter(Boolean).slice(0,10);
  app.innerHTML=`<h1>🎯 Weak spots</h1><p class="sub">Questions you missed in objective quizzes. A correct answer removes one miss.</p>${list.length?`<div class="card">${list.map(x=>`<div class="block"><div class="what"><b>${esc(x.c.code)} · ${esc(x.t.n)}</b><div>${esc(x.q.q)}</div></div><span class="pill r">${x.count} miss${x.count===1?'':'es'}</span></div>`).join('')}<button class="btn green big" onclick="runWeakQuiz()">Drill ${list.length} question${list.length===1?'':'s'} →</button></div>`:'<div class="card"><p>No missed questions saved yet. Missed objective questions will appear here.</p><button class="btn" onclick="go(\'courses\')">Browse courses</button></div>'}`}
function runWeakQuiz(){const items=Object.entries(ST.weak||{}).map(([id,x])=>{const c=CBY[x.cid],t=c&&c.topics.find(z=>z.id===x.tid),q=t&&(t.quiz||[]).find(z=>z.q===x.q);return q?{id,c,t,q}:null}).filter(Boolean).slice(0,10);if(!items.length)return weakDrill();let k=0,got=0;
  function show(){if(k>=items.length){app.innerHTML=`<div class="card"><h1>Drill complete</h1><p>${got}/${items.length} correct.</p><button class="btn green" onclick="go('weak')">Back to weak spots</button></div>`;return}const x=items[k],q=x.q;app.innerHTML=`<div class="kbd">${x.c.code} · ${k+1}/${items.length}</div><h1>${esc(q.q)}</h1><div class="card"><div>${objHTML(q,'wq')}</div><button id="wcheck" class="btn">Check</button><div id="wfb"></div></div>`;document.getElementById('wcheck').onclick=()=>{const ok=objCheck(q,'wq');if(ok){got++;rememberCorrect(x.c.id,x.t.id,q)}else rememberMiss(x.c.id,x.t.id,q);document.getElementById('wfb').innerHTML=`<p class="${ok?'ok':'no'}">${ok?'Correct!':'Answer: '+esc(objAnswer(q))}</p><button class="btn green" onclick="window._wqn()">Next →</button>`;document.getElementById('wcheck').style.display='none'};window._wqn=()=>{k++;show()}}show()}

/* ---------- ROADMAP ---------- */
function plan(){const P=buildPlan();const t=TODAY();
  app.innerHTML=`<h1>Your roadmap</h1><p class="sub">Day-by-day to your last exam. The plan puts more time on whichever course is most behind for its exam date, mixes courses so you interleave, and keeps the day before each exam for a timed mock.</p>
  ${P.atRisk.length?`<div class="warnbox">⚠️ <b>Not enough time at your current daily goal for:</b> ${P.atRisk.map(x=>`${x.c.code} (${x.n} topic${x.n>1?'s':''}, ~${Math.round(x.min/60*10)/10}h)`).join(', ')}. Add extra blocks on free days, or start these topics earlier.</div>`:''}
  ${P.days.map(d=>{const tot=d.blocks.reduce((a,b)=>a+b.min,0);const cls=CATALOG.classDays[d.k];return`<div class="day ${d.k===t?'today':''} ${d.exam.length?'exam':''}"><div class="row"><b>${d.k===t?'Today · ':''}${pretty(d.k)}</b><span class="kbd">${tot} min planned · goal ${d.cap}</span>${cls?`<span class="pill">🏫 ${cls}</span>`:''}${d.exam.map(c=>`<span class="pill" style="background:var(--bad-soft);color:var(--bad)">📝 ${c.code} exam ${new Date(c.exam).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</span>`).join('')}</div>
   ${(d.k===t?todayPlan():d.blocks).map(b=>{const c=b.c?CBY[b.c]:null;return`<div class="kbd" style="padding:2px 0">• <b style="color:${c?c.color:'#666'}">${c?c.code:'Review'}</b> ${esc(b.label)} <span>(${b.min}m)</span></div>`}).join('')||'<div class="kbd">Rest / buffer</div>'}</div>`}).join('')}`}

function course(id){const c=CBY[id];if(!c)return go('courses');app.style.setProperty('--c',c.color);

   ${c.data&&c.data.calc?`<button class="btn ghost" onclick="go('calc-${id}')">🧮 Calculations</button>`:''}${c.data&&c.data.past?`<button class="btn orange" onclick="go('past-${id}')">📜 Past paper</button><button class="btn purple" onclick="go('sit-${id}')">🎓 Sit it timed${ST.sitDraft&&ST.sitDraft[id]?' (resume)':''}</button>`:''}</div>
  ${(()=>{const n=confCounts(id);return`<div class="kbd" style="margin-top:8px">Confidence: 🔴 ${n.r} · 🟠 ${n.a} · 🟢 ${n.g}${n['']?` · ⚪ ${n['']} not rated`:''}. Rate each topic with the dots; the exam-eve sheet puts shaky topics first.</div>`})()}
  <h2>Topics</h2>
  ${c.topics.map(t=>{const st=topicState(id,t.id),[cl,lbl]=STATE_LBL[st];return`<div class="card" style="border-left:5px solid ${c.color}"><div class="row"><div style="flex:1"><div class="kbd">${t.n}</div><b>${esc(t.title)}</b> <span class="pill ${cl}">${lbl}</span>${t.noExam?' <span class="pill o">not in exam</span>':''}</div>${confButtons(id,t.id)}
   ${t.outline?`<button class="btn small ${st==='mastered'?'ghost':'green'}" onclick="markOutline('${id}','${t.id}')">${st==='mastered'?'✓ Done':'Mark studied'}</button>`:`<button class="btn small" onclick="go('lesson-${id}-${t.id}-0')">Learn</button><button class="btn small ghost" onclick="go('recall-${id}-${t.id}')">Recall</button>${t.quiz&&t.quiz.length?`<button class="btn small ghost" onclick="go('quiz-${id}-${t.id}')">Quiz</button>`:''}${t.theory&&t.theory.length?`<button class="btn small ghost" onclick="go('theory-${id}-${t.id}')">Theory</button>`:''}`}</div>
   ${(()=>{const p=ST.topics[tkey(id,t.id)];return p&&(p.recallBest!=null||p.theoryBest!=null)?`<div class="kbd">Best recall ${p.recallBest??'—'}% · best theory ${p.theoryBest??'—'}%</div>`:''})()}</div>`}).join('')}`}
function markOutline(c,t){const p=TP(c,t);if(topicState(c,t)==='mastered'){p.recallBest=null;p.recallLast=null;p.cards=[]}else{p.started=p.started||TODAY();p.recallBest=100;p.recallLast=100;p.recallLastDay=TODAY();addXP(30,'topic studied');confetti()}save();course(c)}

/* ---------- LESSON ---------- */
function lesson(cid,tid,i){const c=CBY[cid],t=c.topics.find(x=>x.id===tid);if(!t||t.outline)return course(cid);app.style.setProperty('--c',c.color);
  const card=t.cards[i];if(!card)return go('feyn-'+cid+'-'+tid);const p=TP(cid,tid);p.started=p.started||TODAY();
  app.innerHTML=`<div class="kbd"><a href="#course-${cid}">${c.code}</a> · ${t.n}</div>${i===0?`<h1>${esc(t.title)}</h1><p class="sub">${esc(t.why||'')}</p>${warmup(cid,tid)}`:`<h3 style="margin:4px 0">${esc(t.title)}</h3>`}
   <div class="prog">${t.cards.map((_,k)=>`<i class="${p.cards.includes(k)||k<i?'d':''}"></i>`).join('')}</div>
   <div class="card"><div class="kbd">Card ${i+1} of ${t.cards.length}</div><h2 style="margin-top:4px">${card.h}</h2>${card.b}</div>
   <div class="card" style="background:var(--card2)"><b>🗣 Say it out loud:</b> close your eyes and explain this card in one sentence. Can't? Read it once more.</div>
   <button class="btn ghost" ${i===0?'disabled':''} onclick="go('lesson-${cid}-${tid}-${i-1}')">← Back</button>
   <button class="btn green big" onclick="cardDone('${cid}','${tid}',${i})">${i===t.cards.length-1?'Done → Explain it':'Got it → Next'}</button>`}
function cardDone(cid,tid,i){const p=TP(cid,tid);if(!p.cards.includes(i)){p.cards.push(i);day().cards++;addXP(5)}questTick();checkBadges();save();go('lesson-'+cid+'-'+tid+'-'+(i+1))}
function warmup(cid,tid){const pool=[];Object.entries(ST.srs).forEach(([k,v])=>{const[c,t,i]=k.split('|');if(c===cid&&t===tid)return;const co=CBY[c];if(!co||ST.examsDone[c])return;const to=co.topics.find(x=>x.id===t);if(to&&to.recall&&to.recall[i])pool.push([co.code,to.recall[i][0],to.recall[i][1]])});
  if(!pool.length)return'';const pick=pool.sort(()=>Math.random()-.5).slice(0,3);
  return`<div class="card" style="background:var(--warm)"><b>🔁 Warm-up from earlier topics</b>. Answer in your head, then tap.${pick.map(p=>`<div style="margin-top:10px"><div><span class="pill">${p[0]}</span>${esc(p[1])}</div><button class="btn small ghost" onclick="this.nextElementSibling.classList.toggle('show')">Show</button><div class="reveal ok" style="font-weight:500">${esc(p[2])}</div></div>`).join('')}</div>`}

/* ---------- FEYNMAN ---------- */
function feyn(cid,tid){const c=CBY[cid],t=c.topics.find(x=>x.id===tid);app.style.setProperty('--c',c.color);const prev=ST.feyn[tkey(cid,tid)]||'';
  app.innerHTML=`<div class="kbd">${c.code} · ${t.n}</div><h1>🗣 Explain it like a teacher</h1>
  <p class="sub">Feynman technique: explain <b>${esc(t.title)}</b> in plain words to a JSS1 student. No notes. Gaps you hit here are what you need to revise.</p>
  <div class="card"><textarea id="fy" style="min-height:170px" placeholder="Start with: This topic is about…">${esc(prev)}</textarea><div class="kbd" id="wc">0 words · aim for 40+</div>
  <button class="btn green big" onclick="saveFeyn('${cid}','${tid}')">Save explanation → Recall quiz</button> <button class="btn ghost" onclick="go('recall-${cid}-${tid}')">Skip</button></div>`;
  const ta=document.getElementById('fy'),wc=document.getElementById('wc');const upd=()=>{const n=ta.value.trim().split(/\s+/).filter(Boolean).length;wc.textContent=n+' words · aim for 40+'};ta.oninput=upd;upd()}
function saveFeyn(cid,tid){const v=document.getElementById('fy').value.trim();const n=v.split(/\s+/).filter(Boolean).length;
  if(n<25){toast('Write at least 25 words');return}const k=tkey(cid,tid);const first=!ST.feyn[k];ST.feyn[k]=v;if(first){day().feyn++;addXP(15,'explained it')}questTick();save();go('recall-'+cid+'-'+tid)}

/* ---------- RECALL ---------- */
function recall(cid,tid){const c=CBY[cid],t=c.topics.find(x=>x.id===tid);if(!t||!t.recall)return course(cid);app.style.setProperty('--c',c.color);
  let k=0,got=0,combo=0,missed=[];const qs=t.recall.map((r,i)=>({q:r[0],a:r[1],i})).sort(()=>Math.random()-.5);
  function show(){if(k>=qs.length){const pct=Math.round(100*got/qs.length),p=TP(cid,tid);p.recallLast=pct;p.recallLastDay=TODAY();p.recallBest=Math.max(p.recallBest??0,pct);
      const xp=got*3+(pct===100?15:0);addXP(xp,'recall');if(pct>=80){confetti();chime(4)}checkBadges();save();
      const st=topicState(cid,tid);
      app.innerHTML=`<div class="card" style="text-align:center"><div class="bigemoji">${pct>=80?'🏆':pct>=50?'💪':'🌱'}</div><h1>${got}/${qs.length} · ${pct}%</h1><div class="xpgain">+${xp} XP</div>
       <p>${pct>=80?'Strong. This topic is close to mastered.':pct>=50?'Getting there. Re-read the cards you missed, then retry.':'Normal for a first pass. Go through the cards once more.'}</p>
       ${st==='mastered'?'<p class="ok">⭐ Topic mastered!</p>':''}</div>
       ${missed.length?`<div class="card"><h3 style="margin-top:0">Revise these (they come back in spaced review):</h3><ul>${missed.map(m=>`<li><b>${esc(m.q)}</b><br><span class="kbd">${esc(m.a)}</span></li>`).join('')}</ul></div>`:''}
       ${t.quiz&&t.quiz.length?`<button class="btn green big" onclick="go('quiz-${cid}-${tid}')">Next: objective quiz →</button>`:t.theory&&t.theory.length?`<button class="btn green big" onclick="go('theory-${cid}-${tid}')">Next: theory practice →</button>`:''}
       <button class="btn ghost" onclick="go('recall-${cid}-${tid}')">Retry</button><button class="btn ghost" onclick="go('course-${cid}')">Back to course</button>`;return}
    const Q=qs[k];app.innerHTML=`<div class="kbd">${c.code} · ${t.n} · Active recall</div><h1>From memory only</h1>
     <div class="prog">${qs.map((_,j)=>`<i class="${j<k?'d':''}"></i>`).join('')}</div>${combo>=3?`<div class="pill" style="background:var(--fire-soft);color:var(--fire)">🔥 Combo ×${combo}</div>`:''}
     <div class="card"><div class="kbd">Question ${k+1} of ${qs.length}</div><h2 style="margin-top:4px">${esc(Q.q)}</h2>
     <textarea id="ra" placeholder="Type or say your answer, then reveal."></textarea>
     <button class="btn" style="margin-top:8px" onclick="document.getElementById('rv').classList.add('show');this.style.display='none'">Reveal answer</button>
     <div class="reveal" id="rv"><div class="def"><b>Answer</b>${esc(Q.a)}</div><p><b>Did you get the key idea?</b></p>
     <button class="btn green" id="yes">✓ Yes</button><button class="btn red" id="no">✗ Not really</button></div></div>`;
    document.getElementById('yes').onclick=()=>{got++;combo++;day().recall++;day().correct++;srsAnswer(cid,tid,Q.i,true);if(combo>=3)chime(1);questTick();k++;show()};
    document.getElementById('no').onclick=()=>{combo=0;day().recall++;missed.push(Q);srsAnswer(cid,tid,Q.i,false);k++;show()}}
  show()}

/* ---------- QUIZ (MCQ + fill-in-the-gap) ---------- */
function normA(x){return String(x).toLowerCase().replace(/[^a-z0-9.%+\-]/g,' ').replace(/\s+/g,' ').trim()}
function gapOk(it,v){const ans=[it.a].concat(it.alt||[]);return ans.some(a=>normA(a)===normA(v))}
function objHTML(it,name){if(it.k==='mcq')return it.o.map((o,j)=>`<label class="opt" style="margin:6px 0;padding:9px"><input type="radio" name="${name}" value="${j}"><div>${esc(o)}</div></label>`).join('');
  if(it.k==='tf')return['True','False'].map((o,j)=>`<label class="opt" style="margin:6px 0;padding:9px"><input type="radio" name="${name}" value="${j}"><div>${o}</div></label>`).join('');
  return`<input type="text" name="${name}" placeholder="Type the missing word(s)">`}
function objCheck(it,name,root){root=root||document;if(it.k==='gap'){const el=root.querySelector(`[name="${name}"]`);return el&&gapOk(it,el.value)}
  const r=root.querySelector(`[name="${name}"]:checked`);if(!r)return false;const want=it.k==='tf'?(it.a?0:1):it.a;return+r.value===want}
function objAnswer(it){return it.k==='mcq'?it.o[it.a]:it.k==='tf'?(it.a?'True':'False'):it.a}
function quiz(cid,tid){const c=CBY[cid],t=c.topics.find(x=>x.id===tid);if(!t||!t.quiz)return course(cid);app.style.setProperty('--c',c.color);
  const items=t.quiz.slice().sort(()=>Math.random()-.5);let k=0,got=0;
  function show(){if(k>=items.length){const pct=Math.round(100*got/items.length),p=TP(cid,tid);p.quizBest=Math.max(p.quizBest??0,pct);addXP(got*3+(pct===100?10:0),'quiz');if(pct>=80){confetti();chime(4)}save();
      app.innerHTML=`<div class="card" style="text-align:center"><div class="bigemoji">${pct>=80?'🏆':'💪'}</div><h1>${got}/${items.length} · ${pct}%</h1><p>${pct>=80?'Sharp.':'Review the explanations, then retry.'}</p></div>
      ${t.theory&&t.theory.length?`<button class="btn green big" onclick="go('theory-${cid}-${tid}')">Next: theory practice →</button>`:''}<button class="btn ghost" onclick="go('quiz-${cid}-${tid}')">Retry</button><button class="btn ghost" onclick="go('course-${cid}')">Back to course</button>`;return}
    const it=items[k];app.innerHTML=`<div class="kbd">${c.code} · ${t.n} · Objective quiz</div><h1>${it.k==='gap'?'Fill in the gap':it.k==='tf'?'True or false?':'Pick one'}</h1>
     <div class="prog">${items.map((_,j)=>`<i class="${j<k?'d':''}"></i>`).join('')}</div>
     <div class="card"><div class="kbd">Question ${k+1} of ${items.length}</div><h2 style="margin-top:4px">${esc(it.q)}</h2><div id="qa">${objHTML(it,'qx')}</div>
     <button class="btn" id="qchk" style="margin-top:8px">Check</button><div id="qfb"></div></div>`;
    document.getElementById('qchk').onclick=()=>{const ok=objCheck(it,'qx');day().recall++;if(ok){got++;day().correct++;rememberCorrect(cid,tid,it);chime(1)}else rememberMiss(cid,tid,it);questTick();
      document.getElementById('qfb').innerHTML=`<p class="${ok?'ok':'no'}">${ok?'Correct!':'Answer: '+esc(objAnswer(it))}</p>${it.w?`<p class="kbd">${esc(it.w)}</p>`:''}<button class="btn green" onclick="window._qn()">Next →</button>`;document.getElementById('qchk').style.display='none'};
    window._qn=()=>{k++;show()}}
  show()}

  ${P.qs.map((q,i)=>`<div class="card"><h3 style="margin-top:0">${esc(q.h||('Q'+(i+1)))}${q.marks?` <span class="pill">${q.marks} marks</span>`:''}</h3><p>${q.q}</p><textarea placeholder="Write your answer…"></textarea>

/* ---------- THEORY ---------- */
function theory(cid,tid){const c=CBY[cid],t=c.topics.find(x=>x.id===tid);app.style.setProperty('--c',c.color);
  app.innerHTML=`<div class="kbd">${c.code} · ${t.n}</div><h1>Exam-style theory</h1><p class="sub">Pick ONE question. Write a full answer (8–10 min): define → explain in numbered points → example → conclude. Then mark yourself honestly.</p>
  ${t.theory.map((q,i)=>`<div class="card"><h3 style="margin-top:0">Q${i+1}. ${esc(q.q)}</h3><textarea placeholder="Write your answer…"></textarea><button class="btn small ghost" style="margin-top:8px" onclick="go('essay-${cid}-${tid}-${i}')">✍️ Write it in the 5-part frame</button>
   <button class="btn small" style="margin-top:8px" onclick="document.getElementById('tr${i}').classList.add('show')">Mark my answer</button>
   <div class="reveal" id="tr${i}"><h3>Tick each point you included</h3><div class="pts">${q.pts.map(p=>`<label><input type="checkbox" class="p${i}" onchange="tscore('${cid}','${tid}',${i},${q.pts.length})">${esc(p)}</label>`).join('')}</div>
   <p id="sc${i}" class="kbd"></p><button class="btn small purple" onclick="tsubmit('${cid}','${tid}',${i},${q.pts.length})">Save score</button>
   <details><summary><b>Model answer</b></summary>${q.model}</details></div></div>`).join('')}
  <button class="btn ghost" onclick="go('course-${cid}')">Back to course</button>`}
function tscore(cid,tid,i,n){const s=document.querySelectorAll('.p'+i+':checked').length;document.getElementById('sc'+i).innerHTML=`<b>${s}/${n}</b> — ${s/n>=.75?'exam-ready':s/n>=.5?'pass level; add the missing points':'re-read the model answer, then rewrite from memory'}`}
function tsubmit(cid,tid,i,n){const s=document.querySelectorAll('.p'+i+':checked').length,pct=Math.round(100*s/n),p=TP(cid,tid);p.theoryBest=Math.max(p.theoryBest??0,pct);day().theory++;addXP(10+Math.round(pct/10),'theory');questTick();checkBadges();save();
  if(topicState(cid,tid)==='mastered'){confetti();chime(5);modal(`<div class="bigemoji">⭐</div><h2>Topic mastered!</h2><p>${esc(CBY[cid].topics.find(x=>x.id===tid).title)}</p><button class="btn green big" onclick="closeModal();go('course-${cid}')">Next topic</button>`)}else toast('Saved: '+pct+'%')}

/* ---------- REVIEW (spaced) ---------- */
function review(){const items=dueItems().sort(()=>Math.random()-.5).slice(0,25);
  if(!items.length){app.innerHTML=`<h1>🔁 Spaced review</h1><div class="card"><p><b>Nothing due right now.</b> Cards you answer in recall quizzes come back here after 1, 2, 4, 7 and 14 days. Miss one and it returns tomorrow.</p><button class="btn purple" onclick="go('weak')">🎯 Drill weak spots</button><button class="btn" onclick="go('home')">Back to today</button></div>`;return}
  let k=0,got=0;function show(){if(k>=items.length){addXP(got*2,'review');confetti();app.innerHTML=`<div class="card" style="text-align:center"><div class="bigemoji">🔁</div><h1>Review cleared</h1><p>${got}/${items.length} remembered.</p><button class="btn green big" onclick="go('home')">Back to today</button></div>`;return}
    const it=items[k];app.style.setProperty('--c',it.co.color);
    app.innerHTML=`<h1>🔁 Spaced review</h1><div class="kbd">${k+1}/${items.length} due · ${it.co.code} · ${esc(it.to.title)}</div>
     <div class="card fc" id="fc"><div class="side">Question</div><div><b>${esc(it.q)}</b></div></div><div id="ctl"><button class="btn big" onclick="flipR()">Show answer</button></div>`;
    window.flipR=()=>{document.getElementById('fc').innerHTML=`<div class="side">Answer</div><div>${esc(it.a)}</div>`;document.getElementById('ctl').innerHTML=`<button class="btn green big" id="y">✓ Knew it</button><button class="btn red big" id="n">✗ Forgot</button>`;
      document.getElementById('y').onclick=()=>{got++;srsAnswer(it.c,it.t,it.i,true);day().review++;day().correct++;questTick();save();k++;show()};
      document.getElementById('n').onclick=()=>{srsAnswer(it.c,it.t,it.i,false);day().review++;questTick();save();k++;show()}}}
  show()}

/* ---------- FLASHCARDS ---------- */
function flash(cid){const c=CBY[cid];if(!c||!c.data)return go('courses');app.style.setProperty('--c',c.color);
  let pool=[];c.topics.forEach(t=>(t.recall||[]).forEach(r=>pool.push({t:t.title,q:r[0],a:r[1]})));pool.sort(()=>Math.random()-.5);let k=0,fl=false,again=[];
  function show(){if(k>=pool.length){if(again.length){pool=again.sort(()=>Math.random()-.5);again=[];k=0}else{addXP(10,'deck cleared');confetti();app.innerHTML=`<div class="card" style="text-align:center"><div class="bigemoji">🃏</div><h1>Deck cleared</h1><button class="btn green big" onclick="go('course-${cid}')">Back to course</button></div>`;return}}
    const x=pool[k];app.innerHTML=`<div class="kbd">${c.code} · flashcards · ${k+1}/${pool.length} · ${again.length} to repeat</div>
     <div class="card fc" onclick="fFlip()"><div class="side">${fl?'Answer':esc(x.t)}</div><div>${fl?esc(x.a):'<b>'+esc(x.q)+'</b>'}</div></div>
     ${fl?`<button class="btn green big" onclick="fNext(1)">✓ Knew it</button><button class="btn red big" onclick="fNext(0)">✗ Again</button>`:`<button class="btn big" onclick="fFlip()">Flip</button>`}`}
  window.fFlip=()=>{fl=!fl;show()};window.fNext=ok=>{if(!ok)again.push(pool[k]);day().flash++;questTick();save();k++;fl=false;show()};show()}

/* ---------- CALC ---------- */
function calc(cid){const c=CBY[cid];const C=(c.data&&c.data.calc)||[];app.style.setProperty('--c',c.color);
  app.innerHTML=`<div class="kbd">${c.code}</div><h1>🧮 Calculation drills</h1><p class="sub">Work on paper, then type the number.</p>
  ${C.map((q,i)=>`<div class="card"><span class="pill">${q.t}</span><p>${q.q}</p><input type="number" step="any" id="c${i}" placeholder="Your answer"><button class="btn small" style="margin-top:8px" onclick="chk('${cid}',${i})">Check</button><div id="cr${i}"></div></div>`).join('')}`}
function chk(cid,i){const q=CBY[cid].data.calc[i];const v=parseFloat(document.getElementById('c'+i).value);const el=document.getElementById('cr'+i);if(isNaN(v)){el.innerHTML='<p class="kbd">Enter a number.</p>';return}
  const ok=q.abs?Math.abs(Math.abs(v)-Math.abs(q.ans))<=q.tol:Math.abs(v-q.ans)<=q.tol;el.innerHTML=`<p class="${ok?'ok':'no'}">${ok?'Correct!':'Not quite.'}</p><p>${q.sol}</p>`;if(ok){day().correct++;addXP(5);questTick()}}

/* ---------- MOCK ---------- */
let mockT=null;
function mock(cid){const c=CBY[cid];if(!c||!c.data)return go('course-'+cid);app.style.setProperty('--c',c.color);
  const all=[];c.topics.filter(t=>!t.noExam).forEach(t=>(t.theory||[]).forEach(q=>all.push(Object.assign({topic:t.title},q))));
  const seed=hash(TODAY()+cid);const qs=all.map(q=>[hash(q.q+seed),q]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).slice(0,c.mockTheory||4);window._mq=qs;
  const ob=[];c.topics.filter(t=>!t.noExam).forEach(t=>(t.quiz||[]).forEach(q=>ob.push(q)));const os=ob.map(q=>[hash(q.q+seed),q]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).slice(0,10);window._mo=os;
  const last=ST.mocks[cid];
  app.innerHTML=`<div class="kbd">${c.code}</div><h1>📝 Timed mock</h1><p class="sub">Objective + theory, <b>45 minutes</b>, closed notes. ${esc(c.format)}</p>
  ${last?`<div class="card ok">Last mock: ${last.score}% on ${pretty(last.date)}</div>`:''}
  <div class="card" style="text-align:center"><div style="font-size:38px;font-weight:900" id="mclock">45:00</div><button class="btn green" id="mst" onclick="startMock()">Start the clock</button></div>
  ${os.length?`<h2>Section A · Objective (${os.length})</h2>`+os.map((q,i)=>`<div class="card"><b>A${i+1}.</b> ${esc(q.q)}<div>${objHTML(q,'mo'+i)}</div></div>`).join('')+'<h2>Section B · Theory</h2>':''}
  ${qs.map((q,i)=>`<div class="card"><span class="pill">${esc(q.topic)}</span><h3>Q${i+1}. ${esc(q.q)}</h3><textarea placeholder="Your answer…"></textarea></div>`).join('')}
  <button class="btn purple big" onclick="markMock('${cid}')">Finish & mark</button><div id="mmark"></div>`}
function startMock(){let s=2700;clearInterval(mockT);document.getElementById('mst').disabled=true;mockT=setInterval(()=>{s--;const el=document.getElementById('mclock');if(!el){clearInterval(mockT);return}el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s<=0){clearInterval(mockT);chime(3);modal('<div class="bigemoji">⏰</div><h2>Pens down</h2><p>Mark your answers now.</p><button class="btn green" onclick="closeModal()">OK</button>')}},1000)}
function markMock(cid){clearInterval(mockT);const qs=window._mq,os=window._mo||[];let og=0;const ores=os.map((q,i)=>{const ok=objCheck(q,'mo'+i);if(ok)og++;return`<div class="kbd">${ok?'✅':'❌'} A${i+1}: ${esc(objAnswer(q))}</div>`}).join('');window._obj=[og,os.length];
  document.getElementById('mmark').innerHTML=(os.length?`<div class="card"><h3 style="margin-top:0">Section A: ${og}/${os.length}</h3>${ores}</div>`:'')+`<h2>Mark Section B strictly</h2>`+qs.map((q,i)=>`<div class="card"><h3>Q${i+1}</h3><div class="pts">${q.pts.map(p=>`<label><input type="checkbox" class="mk" onchange="mockScore()">${esc(p)}</label>`).join('')}</div><details><summary><b>Model answer</b></summary>${q.model}</details></div>`).join('')+`<div class="card" id="mtot"></div><button class="btn green big" onclick="saveMock('${cid}')">Save mock score</button>`;mockScore();document.getElementById('mmark').scrollIntoView({behavior:'smooth'})}
function mockScore(){const o=window._obj||[0,0];const a=document.querySelectorAll('.mk').length+o[1],c=document.querySelectorAll('.mk:checked').length+o[0],p=Math.round(100*c/Math.max(1,a));document.getElementById('mtot').innerHTML=`<h2>${c}/${a} points · ${p}%</h2><p>${p>=77?'On track for 50+/65.':p>=55?'Pass territory. Drill the questions where you lost most points.':'Redo the weakest topics\' recall quizzes, then try again.'}</p><div class="kbd">50/65 ≈ 77%.</div>`;window._mp=p}
function saveMock(cid){ST.mocks[cid]={score:window._mp||0,date:TODAY()};addXP(50,'mock');confetti();chime(4);checkBadges();save();go('course-'+cid)}

/* ---------- EXAM-EVE SHEET ---------- */
function boxesIn(html,cls){const d=document.createElement('div');d.innerHTML=html||'';return[...d.querySelectorAll('.'+cls)].map(e=>e.innerHTML)}
function eve(cid){const c=CBY[cid];if(!c)return go('courses');app.style.setProperty('--c',c.color);
  const rank={r:0,a:1,'':2,g:3},col={r:'var(--red)',a:'var(--amber)',g:'var(--green)','':'var(--line)'},dot={r:'🔴',a:'🟠',g:'🟢','':'⚪'};
  const ts=c.topics.map((t,i)=>({t,i,v:confOf(cid,t.id)})).sort((x,y)=>rank[x.v]-rank[y.v]||x.i-y.i);const n=confCounts(cid);const P=c.data&&c.data.past;
  app.innerHTML=`<div class="kbd no-print"><a href="#course-${cid}">${c.code}</a></div><h1>🌙 Exam-eve sheet</h1>
  <p class="sub">${c.code} · exam ${pretty(c.examDay)}, ${new Date(c.exam).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}. Shakiest topics first, with every exam trap and memory hook. Read it slowly the night before, then sleep.</p>
  <div class="row no-print"><button class="btn small" onclick="window.print()">🖨 Print / Save PDF</button><span class="pill" style="background:var(--bad-soft);color:var(--bad)">🔴 ${n.r}</span><span class="pill r">🟠 ${n.a}</span><span class="pill m">🟢 ${n.g}</span>${n['']?`<span class="pill o">⚪ ${n['']} not rated</span>`:''}</div>
  ${n['']===c.topics.length?`<div class="warnbox no-print">Rate your topics on the course page (🔴 🟠 🟢) and this sheet puts your weakest topics first.</div>`:''}
  <div class="card"><b>Exam format:</b> ${esc(c.format)}${P&&P.rule?`<div style="margin-top:4px"><b>Past-paper rule:</b> ${esc(P.rule)}</div>`:''}</div>
  ${ts.map(({t,v})=>{const traps=[].concat(...(t.cards||[]).map(k=>boxesIn(k.b,'trap'))),hooks=[].concat(...(t.cards||[]).map(k=>boxesIn(k.b,'hook')));const rec=v==='g'?[]:(t.recall||[]).slice(0,v==='r'?999:10);
   return`<div class="card" style="border-left:6px solid ${col[v]}"><h3 style="margin-top:0">${dot[v]} ${esc(t.title)}</h3>
    ${traps.map(x=>`<div class="eve-trap">⚠️ ${x}</div>`).join('')}${hooks.map(x=>`<div class="eve-hook">🧠 ${x}</div>`).join('')}
    ${rec.length?`<ul>${rec.map(r=>`<li><b>${esc(r[0])}</b> ${esc(r[1])}</li>`).join('')}</ul>`:''}
    ${!traps.length&&!hooks.length&&!rec.length?'<p class="kbd">Confident. Skim the cheat sheet only.</p>':''}</div>`}).join('')}

/* ---------- ESSAY TRAINER (5-part frame) ---------- */
const FRAME=[['Background','Define the key terms and set the context in 2–3 sentences.'],['Answer and solution','Your main points, numbered. One point per line, each with a short explanation.'],['Scenario','A concrete example: a Nigerian business, PAU, or a case from the notes.'],['How they combine','Link your points to the scenario: show how each one plays out there.'],['Conclusion','One or two sentences: your verdict or recommendation.']];
function essayQs(cid){const c=CBY[cid],out=[];c.topics.forEach(t=>(t.theory||[]).forEach((q,i)=>out.push({src:t.id,i,q:q.q,pts:q.pts||[],model:q.model,label:t.title,marks:null,html:false})));
  const P=c.data&&c.data.past;if(P)P.qs.forEach((q,i)=>out.push({src:'past',i,q:q.q,pts:q.pts||[],model:q.model,label:'Past paper · '+(q.h||'Q'+(i+1)),marks:q.marks,html:true}));return out}
function essayRandom(cid){const Q=essayQs(cid);if(!Q.length)return;const x=Q[Math.floor(Math.random()*Q.length)];go('essay-'+cid+'-'+x.src+'-'+x.i)}
function essayPick(cid){const c=CBY[cid];if(!c)return go('courses');app.style.setProperty('--c',c.color);const Q=essayQs(cid);ST.essays=ST.essays||{};
  app.innerHTML=`<div class="kbd"><a href="#course-${cid}">${c.code}</a></div><h1>✍️ Essay trainer</h1><p class="sub">Write any theory answer in the five-part frame: Background → Answer and solution → Scenario → How they combine → Conclusion. Then tick the marking points you hit. Drafts save as you type.</p>
  ${Q.length?`<div class="row"><button class="btn green" onclick="essayRandom('${cid}')">🎲 Random question</button></div>`:'<div class="card">No theory questions in this course yet.</div>'}
  <div class="card">${Q.map(x=>{const d=ST.essays[cid+'|'+x.src+'|'+x.i],txt=plainHTML(x.q);return`<div class="block"><div class="what"><div class="kbd">${esc(x.label)}${x.marks?' · '+x.marks+' marks':''}</div>${esc(txt.slice(0,170))}${txt.length>170?'…':''}</div>${d&&d.best!=null?`<span class="pill m">${d.best}%</span>`:d?'<span class="pill l">draft</span>':''}<button class="btn small" onclick="go('essay-${cid}-${x.src}-${x.i}')">Write</button></div>`}).join('')}</div>`}
function essay(cid,src,i){const c=CBY[cid];if(!c)return go('courses');if(src==null||i==null||isNaN(i))return essayPick(cid);app.style.setProperty('--c',c.color);
  const x=essayQs(cid).find(q=>q.src===src&&q.i===i);if(!x)return essayPick(cid);ST.essays=ST.essays||{};const key=cid+'|'+src+'|'+i;
  const d=ST.essays[key]||{parts:['','','','',''],best:null};const mins=x.marks?Math.max(5,Math.round(x.marks*1.6)):10;window._ek=key;
  app.innerHTML=`<div class="kbd"><a href="#course-${cid}">${c.code}</a> · <a href="#essay-${cid}">Essay trainer</a> · ${esc(x.label)}</div><h1>✍️ Five-part answer</h1>
  <div class="card"><div class="row">${x.marks?`<span class="pill">${x.marks} marks</span>`:''}<span class="pill o">~${mins} min</span>${d.best!=null?`<span class="pill m">best ${d.best}%</span>`:''}</div><div style="font-size:17px;margin-top:6px">${x.html?x.q:'<b>'+esc(x.q)+'</b>'}</div><div class="kbd" style="margin-top:6px">Tip: start the focus timer, then write for about ${mins} minutes without notes.</div></div>
  <div class="card"><div class="bar"><i id="efbar"></i></div><div class="kbd" id="efstat"></div>
  ${FRAME.map(([h,tip],j)=>`<div class="frame"><h3>${j+1}. ${h}</h3><div class="kbd">${tip}</div><textarea id="ef${j}" oninput="essayType(${j},this.value)" placeholder="${h}…">${esc(d.parts[j]||'')}</textarea><div class="kbd" id="efw${j}"></div></div>`).join('')}
  <button class="btn purple big" onclick="document.getElementById('emark').classList.add('show');this.style.display='none';document.getElementById('emark').scrollIntoView({behavior:'smooth'})">Mark my answer</button>
  <div class="reveal" id="emark"><h3>Tick each marking point your answer states clearly</h3><div class="pts">${x.pts.map(p=>`<label><input type="checkbox" class="ep" onchange="essayScore()">${esc(p)}</label>`).join('')}</div>
   <p id="escore" class="kbd"></p><button class="btn green" onclick="essaySave('${cid}','${src}',${i})">Save score</button>
   <details><summary><b>Model answer</b></summary>${x.model}</details></div></div>
  <button class="btn ghost" onclick="essayRandom('${cid}')">🎲 Another question</button>`;essayStat()}
function essayType(j,v){const k=window._ek;ST.essays[k]=ST.essays[k]||{parts:['','','','',''],best:null};ST.essays[k].parts[j]=v;save();essayStat()}
function essayStat(){let filled=0,words=0;FRAME.forEach((_,j)=>{const el=document.getElementById('ef'+j);if(!el)return;const n=el.value.trim().split(/\s+/).filter(Boolean).length;words+=n;if(n>=8)filled++;const w=document.getElementById('efw'+j);if(w)w.textContent=n+' words'+(n>=8?' ✓':'')});
  const b=document.getElementById('efbar');if(b)b.style.width=(20*filled)+'%';const s=document.getElementById('efstat');if(s)s.textContent=`${filled}/5 sections written · ${words} words`}
function essayScore(){const all=document.querySelectorAll('.ep').length,n=document.querySelectorAll('.ep:checked').length,p=all?Math.round(100*n/all):0;document.getElementById('escore').innerHTML=`<b>${n}/${all} points · ${p}%</b> — ${p>=75?'exam-ready':p>=50?'pass level; add the missing points':'re-read the model answer, then rewrite from memory'}`;return p}
function essaySave(cid,src,i){const p=essayScore(),k=cid+'|'+src+'|'+i;ST.essays[k]=ST.essays[k]||{parts:['','','','',''],best:null};ST.essays[k].best=Math.max(ST.essays[k].best??0,p);
  if(src!=='past'){const tp=TP(cid,src);tp.theoryBest=Math.max(tp.theoryBest??0,p)}day().theory++;addXP(12+Math.round(p/10),'essay');questTick();checkBadges();save();toast('Saved: '+p+'%');if(p>=75){confetti();chime(4)}}

/* ---------- SIT THE REAL PAST PAPER (timed, choose questions, self-mark) ---------- */
function grpOf(h){const m=String(h||'').match(/^(Section [A-Z]|Exam Q\d+|CA\d+|Q\d+)/i);return m?m[1]:String(h||'Q')}
function pastGroups(P){const g=[];P.qs.forEach((q,i)=>{const k=grpOf(q.h);let x=g.find(y=>y.k===k);if(!x){x={k,idx:[],marks:0};g.push(x)}x.idx.push(i);x.marks+=(+q.marks||0)});return g}
function examMins(c){const P=c.data.past;return P.mins||Math.round((new Date(c.examEnd)-new Date(c.exam))/6e4)||120}
function fmtLeft(s){return(s>=3600?Math.floor(s/3600)+':':'')+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function sit(cid){const c=CBY[cid],P=c&&c.data&&c.data.past;if(!P)return go('course-'+cid);app.style.setProperty('--c',c.color);ST.sitDraft=ST.sitDraft||{};const D=ST.sitDraft[cid];
  if(D&&D.phase==='writing')return sitWrite(cid);if(D&&D.phase==='marking')return sitMark(cid);
  const G=pastGroups(P),hist=((ST.sits||{})[cid]||[]).slice(-5).reverse(),comp=P.compulsory||[];
  app.innerHTML=`<div class="kbd"><a href="#course-${cid}">${c.code}</a></div><h1>🎓 Sit the real paper</h1><p class="sub">${esc(P.title)}</p>
  <div class="card"><b>Rule:</b> ${esc(P.rule||'Answer the questions you choose below.')}<div class="kbd" style="margin-top:4px">Time: <b>${examMins(c)} minutes</b>, closed notes. Your answers save as you type, so a refresh will not lose them.</div></div>
  <h2>Choose your questions</h2>${G.map(g=>`<label class="qgrp ${comp.includes(g.k)?'on':''}"><input type="checkbox" class="sg" value="${esc(g.k)}" ${comp.includes(g.k)?'checked':''} onchange="this.closest('.qgrp').classList.toggle('on',this.checked)"><div><b>${esc(g.k)}</b>${comp.includes(g.k)?' <span class="pill r">compulsory</span>':''} <span class="pill">${g.marks} marks</span><div class="kbd">${g.idx.map(i=>esc(P.qs[i].h||'')).join(' · ')}</div></div></label>`).join('')}
  <button class="btn green big" onclick="sitStart('${cid}')">Start the clock ⏱</button>
  ${hist.length?`<h2>Your attempts</h2><div class="card">${hist.map(h=>`<div class="block"><div class="what"><b>${pretty(h.date)}</b> · ${esc(h.groups.join(', '))}<div class="kbd">${h.mins} min used</div></div><b>${h.got}/${h.max} · ${h.pct}%</b></div>`).join('')}</div>`:''}`}
function sitStart(cid){const sel=[...document.querySelectorAll('.sg:checked')].map(x=>x.value);if(!sel.length){toast('Pick at least one question');return}const c=CBY[cid],now=Date.now();ST.sitDraft[cid]={phase:'writing',groups:sel,start:now,end:now+examMins(c)*6e4,ans:{},ticks:{}};saveNow();chime(2);sitWrite(cid)}
function sitWrite(cid){const c=CBY[cid],P=c.data.past,D=ST.sitDraft[cid];const G=pastGroups(P).filter(g=>D.groups.includes(g.k));app.style.setProperty('--c',c.color);
  app.innerHTML=`<div class="card sticky row" style="justify-content:space-between;padding:10px 14px"><div><div class="kbd">${c.code} · real paper · ${esc(D.groups.join(', '))}</div><b id="sclock" style="font-size:22px;font-variant-numeric:tabular-nums">--:--</b></div><button class="btn purple small" onclick="sitFinish('${cid}')">Pens down → mark</button></div>
  ${G.map(g=>`<h2>${esc(g.k)} <span class="pill">${g.marks} marks</span></h2>`+g.idx.map(i=>{const q=P.qs[i];return`<div class="card"><h3 style="margin-top:0">${esc(q.h||'')} ${q.marks?`<span class="pill">${q.marks} marks</span>`:''}</h3><div>${q.q}</div><textarea style="min-height:160px" oninput="sitType('${cid}',${i},this.value)" placeholder="Your answer… (Background → Answer and solution → Scenario → How they combine → Conclusion)">${esc(D.ans[i]||'')}</textarea></div>`}).join('')).join('')}
  <button class="btn purple big" onclick="sitFinish('${cid}')">Pens down → mark my paper</button><button class="btn ghost" onclick="if(confirm('Abandon this attempt? Your answers will be deleted.'))sitAbandon('${cid}')">Abandon attempt</button>`;
  clearInterval(window._sitT);const tick=()=>{const el=document.getElementById('sclock'),d=ST.sitDraft[cid];if(!el||!d||d.phase!=='writing'){clearInterval(window._sitT);return}const s=Math.round((d.end-Date.now())/1000);
    if(s<=0){el.textContent='⏰ Time up';el.style.color='var(--bad)';if(!d.warned){d.warned=1;save();chime(3);modal('<div class="bigemoji">⏰</div><h2>Pens down</h2><p>Time is up. Finish your sentence, then mark your paper.</p><button class="btn green" onclick="closeModal()">OK</button>')}return}
    el.textContent=fmtLeft(s)+' left';el.style.color=s<600?'var(--bad)':''};tick();window._sitT=setInterval(tick,1000)}
function sitType(cid,i,v){const D=ST.sitDraft[cid];if(!D)return;D.ans[i]=v;save()}
function sitAbandon(cid){clearInterval(window._sitT);delete ST.sitDraft[cid];saveNow();sit(cid)}
function sitFinish(cid){const D=ST.sitDraft[cid];if(!D)return sit(cid);D.phase='marking';D.used=Math.max(1,Math.round((Math.min(Date.now(),D.end)-D.start)/6e4));D.ticks=D.ticks||{};clearInterval(window._sitT);saveNow();window.scrollTo(0,0);sitMark(cid)}
function sitIdx(P,D){return[].concat(...pastGroups(P).filter(g=>D.groups.includes(g.k)).map(g=>g.idx))}
function sitBack(cid){ST.sitDraft[cid].phase='writing';save();sitWrite(cid)}
function sitMark(cid){const c=CBY[cid],P=c.data.past,D=ST.sitDraft[cid];app.style.setProperty('--c',c.color);
  app.innerHTML=`<div class="kbd">${c.code} · ${D.used} min used</div><h1>✅ Mark your paper</h1><p class="sub">Be strict: tick a point only if your answer states it clearly. Each part earns its marks × the share of points you ticked.</p>
  <div class="card sticky" id="stot"></div>
  ${sitIdx(P,D).map(i=>{const q=P.qs[i];return`<div class="card"><h3 style="margin-top:0">${esc(q.h||'')} ${q.marks?`<span class="pill">${q.marks} marks</span>`:''}</h3><details open><summary>Your answer</summary><div style="white-space:pre-wrap;background:var(--soft);padding:10px;border-radius:8px">${esc(D.ans[i]||'(blank)')}</div></details>
   <div class="pts">${(q.pts||[]).map((p,j)=>`<label><input type="checkbox" data-k="${i}.${j}" ${D.ticks[i+'.'+j]?'checked':''} onchange="sitTick('${cid}',this)">${esc(p)}</label>`).join('')}</div><details><summary><b>Model answer</b></summary>${q.model}</details></div>`}).join('')}
  <button class="btn green big" onclick="sitSaveScore('${cid}')">Save score</button><button class="btn ghost" onclick="sitBack('${cid}')">← Back to writing</button>`;sitTotal(cid)}
function sitTick(cid,el){const D=ST.sitDraft[cid];D.ticks[el.dataset.k]=el.checked;save();sitTotal(cid)}
function sitCompute(cid){const P=CBY[cid].data.past,D=ST.sitDraft[cid];let got=0,max=0;sitIdx(P,D).forEach(i=>{const q=P.qs[i],m=+q.marks||0,n=(q.pts||[]).length;max+=m;if(n){let t=0;for(let j=0;j<n;j++)if(D.ticks[i+'.'+j])t++;got+=m*t/n}});got=Math.round(got*10)/10;return{got,max,pct:max?Math.round(100*got/max):0}}
function sitTotal(cid){const r=sitCompute(cid),el=document.getElementById('stot');if(el)el.innerHTML=`<h2 style="margin:0">${r.got}/${r.max} marks · ${r.pct}%</h2><div class="kbd">${r.pct>=77?'On track for 50+/65.':r.pct>=55?'Pass territory. Re-learn the points you missed.':'Study the model answers, then sit it again in a few days.'} 50/65 ≈ 77%.</div>`}
function sitSaveScore(cid){const D=ST.sitDraft[cid],r=sitCompute(cid);ST.sits=ST.sits||{};(ST.sits[cid]=ST.sits[cid]||[]).push({date:TODAY(),got:r.got,max:r.max,pct:r.pct,mins:D.used,groups:D.groups});
  day().theory+=sitIdx(CBY[cid].data.past,D).length;delete ST.sitDraft[cid];addXP(80,'real paper');confetti();chime(5);questTick();checkBadges();saveNow();sit(cid)}

/* ---------- CLOUD SYNC (sync code, no login) ----------
   Progress is uploaded to /api/sync a few seconds after each change and pulled when the
   app opens or comes back into focus. Two browsers that both changed things are merged,
   never overwritten. The sync code lives in its own localStorage key, not inside ST. */
var SYNC_KEY='pau400sen_sync';
var SY=(function(){try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{}}catch(e){return{}}})();
var SYNC_OK=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
var syTimer=null,syBusy=false,syMsg='',syLastPull=0;
function sySave(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY))}catch(e){}}
async function syApi(path,opt){const r=await fetch('/api/'+path,Object.assign({headers:{'Content-Type':'application/json'}},opt||{}));let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok&&r.status!==409){const err=new Error((j&&j.error)||('Server replied '+r.status));err.status=r.status;throw err}return{status:r.status,body:j}}
let syEdits=0;function syncSchedule(){if(!SY.code)return;syEdits++;SY.dirty=true;sySave();clearTimeout(syTimer);syTimer=setTimeout(()=>syncPush(),4000)}
function boardEntry(){if(!SY.board||!ST.profile)return null;return{name:ST.profile.name,xp:ST.xp,streak:streakAlive()?ST.streak.count:0,mastered:masteredCount()}}
const mx=(x,y)=>x==null?y:y==null?x:Math.max(x,y);
function mergeState(a,b){/* a = this browser, b = cloud. Keeps the best of both. */
  a=a||blank();b=b||blank();const m=Object.assign(blank(),b,a);
  m.xp=Math.max(a.xp||0,b.xp||0);m.freezes=Math.max(a.freezes||0,b.freezes||0);m.profile=a.profile||b.profile;
  m.days=Object.assign({},b.days);Object.entries(a.days||{}).forEach(([k,d])=>{const o=m.days[k];if(!o){m.days[k]=d;return}const out={};new Set([...Object.keys(o),...Object.keys(d)]).forEach(f=>{out[f]=(typeof d[f]==='boolean'||typeof o[f]==='boolean')?!!(d[f]||o[f]):Math.max(+d[f]||0,+o[f]||0)});m.days[k]=out});
  const sa=a.streak||{},sb=b.streak||{};m.streak=Object.assign({},(sa.last||'')>=(sb.last||'')?sa:sb);if(sa.last&&sa.last===sb.last)m.streak.count=Math.max(sa.count||0,sb.count||0);m.streak.best=Math.max(sa.best||0,sb.best||0,m.streak.count||0);
  ['badges','examsDone','feyn','conf','quests','planCache','flags','weak','sitDraft'].forEach(k=>m[k]=Object.assign({},b[k],a[k]));
  m.topics=Object.assign({},b.topics);Object.entries(a.topics||{}).forEach(([k,t])=>{const o=m.topics[k];if(!o){m.topics[k]=t;return}
    m.topics[k]=Object.assign({},o,t,{cards:[...new Set([...(o.cards||[]),...(t.cards||[])])],recallBest:mx(o.recallBest,t.recallBest),theoryBest:mx(o.theoryBest,t.theoryBest),quizBest:mx(o.quizBest,t.quizBest),started:o.started&&t.started?(o.started<t.started?o.started:t.started):(o.started||t.started)})});
  m.srs=Object.assign({},b.srs);Object.entries(a.srs||{}).forEach(([k,v])=>{const o=m.srs[k];if(!o||(v.due||'')>=(o.due||''))m.srs[k]=v});
  m.mocks=Object.assign({},b.mocks);Object.entries(a.mocks||{}).forEach(([k,v])=>{const o=m.mocks[k];if(!o||(v.date||'')>=(o.date||''))m.mocks[k]=v});
  m.essays=Object.assign({},b.essays);Object.entries(a.essays||{}).forEach(([k,v])=>{const o=m.essays[k];m.essays[k]=o?Object.assign({},o,v,{best:mx(o.best,v.best)}):v});
  m.sits={};new Set([...Object.keys(a.sits||{}),...Object.keys(b.sits||{})]).forEach(k=>{const seen=new Set();m.sits[k]=[...((b.sits||{})[k]||[]),...((a.sits||{})[k]||[])].filter(x=>{const s=JSON.stringify(x);if(seen.has(s))return false;seen.add(s);return true})});
  return m}
function streakNewer(a,b){const sa=(a&&a.streak)||{},sb=(b&&b.streak)||{};return (sa.last||'')>(sb.last||'')||((sa.last||'')===(sb.last||'')&&(sa.count||0)>(sb.count||0))||(a.xp||0)>((b&&b.xp)||0)}
function applyRemote(state,rev){ST=Object.assign(blank(),state);saveNow(true);SY.rev=rev;sySave()}
async function syncPush(keepalive,depth){if(!SY.code||!SYNC_OK)return;if(syBusy&&!depth)return;syBusy=true;
  const edits0=syEdits;try{const payload=JSON.stringify({action:'put',code:SY.code,rev:SY.rev||0,state:ST,board:boardEntry()});
    const {status,body:j}=await syApi('sync',{method:'POST',body:payload,keepalive:!!keepalive&&payload.length<60000});
    if(status===409){if((depth||0)>2)throw new Error('conflict');applyRemote(mergeState(ST,j.state),j.rev);SY.dirty=true;sySave();return await syncPush(false,(depth||0)+1)}
    SY.rev=j.rev;SY.last=Date.now();syMsg='';if(syEdits===edits0)SY.dirty=false;else{clearTimeout(syTimer);syTimer=setTimeout(()=>syncPush(),4000)}}
  catch(e){syMsg=e.status===404?'This sync code no longer exists on the server. Turn sync off and on again.':e.status===503?'Sync is not set up on this site yet.':'Offline right now. Your changes are saved here and will sync when you are back online.'}
  finally{if(!depth)syBusy=false;sySave();syncUI()}}
async function syncPull(force){if(!SY.code||!SYNC_OK||syBusy)return;if(!force&&Date.now()-syLastPull<20000)return;syLastPull=Date.now();
  try{const {body:j}=await syApi('sync',{method:'POST',body:JSON.stringify({action:'get',code:SY.code})});
    if(j.rev>(SY.rev||0)){const typing=document.activeElement&&/TEXTAREA|INPUT/.test(document.activeElement.tagName);
      if(SY.dirty||streakNewer(ST,j.state)){applyRemote(mergeState(ST,j.state),j.rev);SY.dirty=true;sySave();syncPush()}else applyRemote(j.state,j.rev);
      if(!typing)render();toast('☁️ Progress updated from your other device')}
    SY.last=Date.now();syMsg='';sySave()}
  catch(e){syMsg=e.status===404?'This sync code no longer exists on the server.':e.status===503?'Sync is not set up on this site yet.':'Offline right now. Your changes are saved here and will sync later.'}
  syncUI()}
async function syncCreate(){if(!SYNC_OK){toast('Sync works on the hosted site, not from a file.');return}
  try{SY.board=SY.board!==false;const {body:j}=await syApi('sync',{method:'POST',body:JSON.stringify({action:'create',state:ST,board:boardEntry()})});
    SY.code=j.code;SY.rev=j.rev;SY.dirty=false;SY.last=Date.now();sySave();confetti();chime(3);me();
    modal(`<div class="bigemoji">☁️</div><h2>Sync is on</h2><p>Your sync code:</p><div class="mono" style="font-size:20px;font-weight:900;letter-spacing:.5px;padding:10px;background:var(--soft);border-radius:10px;user-select:all">${esc(j.code)}</div><p class="kbd">Write it down or screenshot it. Type it on any phone or laptop to continue where you stopped. Anyone with this code can see and change your progress, so keep it private.</p><button class="btn green big" onclick="copyText('${esc(j.code)}');closeModal()">📋 Copy code</button>`)}
  catch(e){modal(`<div class="bigemoji">☁️</div><h2>Sync could not start</h2><p>${esc(e.status===503?'The sync database is not connected to this site yet.':e.status===429?'Too many tries. Wait a minute and try again.':[404,405,501].includes(e.status)?'This copy of the site has no sync server. Open the app from its Vercel address.':navigator.onLine===false?'You are offline. Connect to the internet and try again.':(e.message||'The sync server did not answer.'))}</p><p class="kbd">Your progress is still saved in this browser. Site owner: open <a href="/api/health" target="_blank" rel="noopener">/api/health</a> to see what is missing.</p><button class="btn green" onclick="closeModal()">OK</button>`)}}
async function syncLink(code,after){code=String(code||'').trim();if(!code){toast('Type your sync code');return}if(!SYNC_OK){toast('Sync works on the hosted site, not from a file.');return}
  try{const {body:j}=await syApi('sync',{method:'POST',body:JSON.stringify({action:'get',code})});
    const localHas=ST.profile&&(ST.xp>0||Object.keys(ST.topics||{}).length);
    SY={code:code.toUpperCase().replace(/\s+/g,'-'),rev:j.rev,board:SY.board!==false,last:Date.now()};
    if(localHas){applyRemote(mergeState(ST,j.state),j.rev);SY.dirty=true;sySave();await syncPush();toast('☁️ Linked. Progress from both browsers merged.')}
    else{applyRemote(j.state,j.rev);toast('☁️ Welcome back'+(ST.profile?', '+ST.profile.name:'')+'! Progress restored.')}
    closeModal();confetti();chime(4);if(after)after();else go('home')}
  catch(e){toast(e.message||'That code did not work')}}
function syncForget(){clearTimeout(syTimer);SY={};sySave();syMsg=''}
async function syncSetBoard(on){SY.board=on;sySave();if(!on&&SY.code){try{await syApi('sync',{method:'POST',body:JSON.stringify({action:'leave-board',code:SY.code})})}catch(e){}}else syncPush();toast(on?'You are on the class leaderboard':'Removed from the leaderboard')}
function copyText(t){try{navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>fallbackCopy(t))}catch(e){fallbackCopy(t)}}
function syncAgo(){if(!SY.last)return'not yet';const s=Math.round((Date.now()-SY.last)/1000);return s<60?'just now':s<3600?Math.round(s/60)+' min ago':Math.round(s/3600)+' h ago'}
function syncLinkPrompt(after){modal(`<div class="bigemoji">☁️</div><h2>Continue your progress</h2><p>Type the sync code from your other phone or laptop.</p><input type="text" id="sycode" placeholder="e.g. TIGER-MANGO-RIVER-4821" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase"><div class="row" style="justify-content:center;margin-top:10px"><button class="btn green" id="sygo">Continue</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
  const i=document.getElementById('sycode');i.focus();const go2=()=>syncLink(i.value,after);document.getElementById('sygo').onclick=go2;i.onkeydown=e=>{if(e.key==='Enter')go2()}}
function syncCard(){if(!SYNC_OK)return`<div class="card"><b>☁️ Sync across browsers</b><p class="kbd">Open the app from its web address (not as a file) to turn on sync.</p></div>`;
  if(!SY.code)return`<div class="card"><b>☁️ Sync across browsers</b><p class="kbd">Get a private sync code and continue on any phone, laptop or browser. Progress uploads automatically after each change. No account or password.</p>
   <div class="row"><button class="btn small green" onclick="syncCreate()">Turn on sync</button><button class="btn small ghost" onclick="syncLinkPrompt(()=>go('me'))">I have a sync code</button></div></div>`;
  return`<div class="card" id="sycard"><b>☁️ Sync is on</b><p style="margin:6px 0">Your sync code: <span class="mono" style="font-weight:900;user-select:all">${esc(SY.code)}</span> <button class="btn small ghost" onclick="copyText('${esc(SY.code)}')">📋 Copy</button></p>
   <div class="kbd" id="systat">${syMsg?esc(syMsg):(SY.dirty?'Saving changes…':'Last synced '+syncAgo()+'.')}</div>
   <label class="opt" style="margin-top:8px"><input type="checkbox" ${SY.board!==false?'checked':''} onchange="syncSetBoard(this.checked)"><div><b>Show me on the class leaderboard</b><div class="kbd">Shows your name, streak, XP and topics mastered.</div></div></label>
   <div class="row"><button class="btn small" onclick="syncPull(true);syncPush()">🔄 Sync now</button><button class="btn small ghost" onclick="if(confirm('Stop syncing on this browser? Your progress stays here and in the cloud.')){syncForget();me()}">Stop syncing here</button></div>
   <p class="kbd">Keep the code private: anyone with it can see and change your progress.</p></div>`}
function syncUI(){const el=document.getElementById('systat');if(el)el.textContent=syMsg||(SY.dirty?'Saving changes…':'Last synced '+syncAgo()+'.')}
/* live board on the hosted site */
var cloudRows=null,cloudBoardMsg='';
async function myBoardId(){if(!SY.code||!(window.crypto&&crypto.subtle))return'';const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('study-streak:'+SY.code.toUpperCase().replace(/[^A-Z0-9]/g,'')));return[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,12)}
async function loadCloudBoard(){if(!SYNC_OK)return;try{const {body:j}=await syApi('board');cloudRows=j.rows||[];cloudBoardMsg='';window._myId=await myBoardId()}catch(e){cloudRows=null;cloudBoardMsg=e.status===503?'The live board is not set up on this site yet.':'The live board is unavailable right now.'}if(location.hash==='#board')board()}
function cloudBoardHTML(){if(!SYNC_OK)return'';const rows=cloudRows||[];
  return`<div class="card"><h3 style="margin-top:0">Live class board</h3>${cloudRows===null&&!cloudBoardMsg?'<p class="kbd">Loading…</p>':''}${cloudBoardMsg?`<p class="kbd">${esc(cloudBoardMsg)}</p>`:''}
   ${rows.map((r,i)=>`<div class="lb ${r.id===window._myId?'me':''}"><div class="rk">${i+1}</div><div style="flex:1"><b>${esc(r.name||'?')}</b><div class="kbd">🔥 ${r.streak||0} · ⭐ ${r.mastered||0} mastered</div></div><div style="font-weight:900;color:var(--xp)">⚡ ${r.xp||0}</div></div>`).join('')}
   ${cloudRows&&!rows.length?'<p class="kbd">Nobody on the board yet. Be first.</p>':''}
   ${!SY.code?`<p class="kbd" style="margin-top:8px">To appear here, turn on sync under <a href="#me">Me</a>.</p>`:SY.board===false?`<p class="kbd">You are hidden. Turn on “Show me on the class leaderboard” under <a href="#me">Me</a>.</p>`:''}</div>`}
window.addEventListener('focus',()=>syncPull());
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(SY.dirty)syncPush(true)}else syncPull()});
window.addEventListener('online',()=>{if(SY.dirty)syncPush();else syncPull(true)});
if(SY.code)setTimeout(()=>{if(SY.dirty)syncPush();syncPull(true)},800);

/* ---------- FOCUS TIMER (minutes count toward goal) ----------
   Wall-clock based: minutes are credited from Date.now(), so a locked phone screen,
   a background tab or a reload no longer loses them. State lives in its own key. */
const TKEY='pau400sen_timer';
let tLeft=25*60,tLen=25,tMode='focus',timerRun=false,tInt=null,tEnd=0,tCred=0;
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tSave(){try{localStorage.setItem(TKEY,JSON.stringify({len:tLen,mode:tMode,left:tLeft,run:timerRun,end:tEnd,cred:tCred}))}catch(e){}}
function tLabel(){const c=document.getElementById('clock'),g=document.getElementById('tgo'),l=document.getElementById('tlabel');if(c)c.textContent=fmt(Math.max(0,tLeft));if(g)g.textContent=timerRun?'⏸ Pause':'▶ Start';
  if(l)l.textContent=tMode==='focus'?'Focus block · minutes count toward your daily goal':'Break · stand up, water, no phone'}
function tCredit(){if(tMode!=='focus')return;const mins=Math.floor((tLen*60-Math.max(0,tLeft))/60);if(mins>tCred){const n=mins-tCred;tCred=mins;day().focus+=n;addMinutes(n)}}
function setTimer(m,mode){if(timerRun)toggleTimer();tLen=m;tMode=mode;tLeft=m*60;tCred=0;tEnd=0;tSave();tLabel()}
function tTick(quiet){tLeft=Math.ceil((tEnd-Date.now())/1000);tCredit();tLabel();
  if(tLeft<=0){clearInterval(tInt);timerRun=false;tLeft=0;tSave();tLabel();if(!quiet)chime(4);
    if(tMode==='focus'){addXP(20,'focus block');if(!quiet)confetti();modal(`<div class="bigemoji">✅</div><h2>Block done!</h2><p>+${tLen} minutes. Take 5: stand up, drink water, no phone.</p><button class="btn green big" onclick="closeModal();setTimer(5,'break');toggleTimer()">Start 5-min break</button><button class="btn ghost" onclick="closeModal();setTimer(25,'focus')">Skip break</button>`)}
    else{modal(`<div class="bigemoji">💪</div><h2>Break over</h2><p>Next block. Open your next item on Today's plan.</p><button class="btn green big" onclick="closeModal();setTimer(25,'focus');toggleTimer();go('home')">Start next block</button>`)}}
  else tSave()}
function toggleTimer(){if(!timerRun&&tLeft<=0){tLeft=tLen*60;tCred=0}timerRun=!timerRun;
  if(timerRun){chime(1);tEnd=Date.now()+tLeft*1000;tSave();clearInterval(tInt);tInt=setInterval(()=>tTick(),1000)}
  else{clearInterval(tInt);tLeft=Math.max(0,Math.ceil((tEnd-Date.now())/1000));tCredit();tEnd=0;tSave()}
  tLabel();renderStats()}
(function tRestore(){let s=null;try{s=JSON.parse(localStorage.getItem(TKEY))}catch(e){}if(!s)return;
  tLen=s.len||25;tMode=s.mode||'focus';tLeft=s.left!=null?s.left:tLen*60;tCred=s.cred||0;tEnd=s.end||0;timerRun=!!(s.run&&tEnd);
  if(timerRun){tTick(true);if(timerRun)tInt=setInterval(()=>tTick(),1000)}else tLabel()})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&timerRun)tTick()});
window.addEventListener('beforeunload',saveNow);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow(true)});
setInterval(()=>{renderStats();pushBoard()},60000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

/* ---------- boot ---------- */
render();
</script>
